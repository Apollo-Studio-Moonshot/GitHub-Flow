name: GitHubFlow
options:
  bundleIdPrefix: dev.githubflow
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  GitHubFlow:
    type: application
    platform: macOS
    sources:
      - path: Sources/GitHubFlow
      - path: Support/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: GitHubFlow
        PRODUCT_BUNDLE_IDENTIFIER: dev.githubflow.app
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  GitHubFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GitHubFlowTests
    dependencies:
      - target: GitHubFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.githubflow.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GitHubFlow.app/Contents/MacOS/GitHubFlow"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

schemes:
  GitHubFlow:
    build:
      targets:
        GitHubFlow: all
        GitHubFlowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GitHubFlowTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
